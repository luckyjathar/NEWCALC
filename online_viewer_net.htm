<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b1329;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .scenario-card {
            width: 100%;
            max-width: 360px;
            background-color: #060e22;
            border: 2px solid #243b6b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .scenario-header {
            background-color: #1e3a68;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            font-size: 26px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 1px;
            border-bottom: 2px solid #243b6b;
        }

        .scenario-table {
            width: 100%;
            border-collapse: collapse;
        }

        .scenario-table tr {
            border-bottom: 1px solid #1c2e4a;
        }

        .scenario-table tr:last-child {
            border-bottom: none;
        }

        .scenario-table td {
            padding: 10px 14px;
            vertical-align: middle;
        }

        .scenario-table td.label-col {
            width: 50%;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-right: 1px solid #1c2e4a;
        }

        .scenario-table td.input-col {
            width: 50%;
            padding: 6px 10px;
        }

        .form-input, .form-select {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
        }

        .form-select {
            cursor: pointer;
            color: #ffffff;
            background-color: #060e22;
        }

        /* नारंगी हाइलाइट (PRODUCT पंक्ति के लिए) */
        .highlight-row {
            background-color: #d35400;
        }

        .highlight-row .form-select {
            background-color: #d35400;
            color: #ffffff;
            font-weight: 900;
        }

        /* ड्रॉपडाउन विकल्पों का स्टाइल */
        option {
            background-color: #060e22;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="scenario-card">
        <div class="scenario-header">Scenario</div>
        
        <table class="scenario-table">
            <tr>
                <td class="label-col">APPROVED</td>
                <td class="input-col">
                    <input type="number" class="form-input" id="approvedVal" value="27000">
                </td>
            </tr>
            <tr>
                <td class="label-col">MAX LTV</td>
                <td class="input-col">
                    <input type="text" class="form-input" id="maxLtvVal" value="86%">
                </td>
            </tr>
            <tr>
                <td class="label-col">TYPE</td>
                <td class="input-col">
                    <select class="form-select" id="typeVal">
                        <option value="NEW" selected>NEW</option>
                        <option value="OLD">OLD</option>
                        <option value="EXISTING">EXISTING</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label-col">GTL/RFC</td>
                <td class="input-col">
                    <select class="form-select" id="gtlRfcVal">
                        <option value="120K" selected>120K</option>
                        <option value="100K">100K</option>
                        <option value="80K">80K</option>
                        <option value="50K">50K</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label-col">HI</td>
                <td class="input-col">
                    <input type="number" class="form-input" id="hiVal" value="0">
                </td>
            </tr>
            <tr>
                <td class="label-col">MARGIN</td>
                <td class="input-col">
                    <input type="number" class="form-input" id="marginVal" value="500">
                </td>
            </tr>
            <tr class="highlight-row">
                <td class="label-col" style="border-right-color: #b34100;">PRODUCT</td>
                <td class="input-col">
                    <select class="form-select" id="productVal">
                        <option value="RDP" selected>RDP</option>
                        <option value="CD">CD</option>
                        <option value="DIGITAL">DIGITAL</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label-col">CASHBACK</td>
                <td class="input-col">
                    <select class="form-select" id="cashbackVal">
                        <option value="NO" selected>NO</option>
                        <option value="YES">YES</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label-col">CAPPING</td>
                <td class="input-col">
                    <input type="number" class="form-input" id="cappingVal" placeholder="">
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
