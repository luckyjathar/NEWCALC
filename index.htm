<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCD Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#38bdf8', // Bright blue accent
                        bgDark: '#000000',
                        panel: '#111111'
                    }
                }
            }
        }
    </script>
    <style>
        /* Zero-scroll frame optimization for mobile */
        body { background-color: #000; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .scrollable-content { overflow-y: auto; flex-grow: 1; padding-bottom: 20px; }
        input, select { background-color: #222; border: 1px solid #333; color: white; border-radius: 4px; padding: 8px; width: 100%; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        .result-box { background-color: #111; border-top: 2px solid #38bdf8; padding: 15px; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="p-3 border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-accent font-bold text-lg">RCD CALCULATOR</h1>
        <button onclick="resetForm()" class="text-xs bg-red-600 px-3 py-1 rounded text-white">RESET</button>
    </div>

    <div class="scrollable-content p-4 space-y-3">
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="text-xs text-gray-400">Invoice Amount (₹)</label>
                <input type="number" id="invoice" oninput="calculate()" placeholder="0">
            </div>
            <div>
                <label class="text-xs text-gray-400">Approved Limit (₹)</label>
                <input type="number" id="approvedLimit" oninput="calculate()" placeholder="0">
            </div>
            <div>
                <label class="text-xs text-gray-400">Max LTV (%)</label>
                <input type="number" id="maxLtv" oninput="calculate()" placeholder="100">
            </div>
            <div>
                <label class="text-xs text-gray-400">Customer Type</label>
                <select id="customerType" onchange="calculate()">
                    <option value="850">New Customer (₹850)</option>
                    <option value="270">EMI Card (₹270)</option>
                    <option value="850">Virtual Card (₹850)</option>
                    <option value="320">W/O Card (₹320)</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-gray-400">Total Tenure</label>
                <input type="number" id="tenure" oninput="calculate()" placeholder="0">
            </div>
            <div>
                <label class="text-xs text-gray-400">Advance EMI</label>
                <input type="number" id="advEmi" oninput="calculate()" placeholder="0">
            </div>
            <div>
                <label class="text-xs text-gray-400">DBD (%)</label>
                <input type="number" id="dbd" oninput="calculate()" step="0.01" placeholder="0">
            </div>
            <div>
                <label class="text-xs text-gray-400">Processing Fee (₹)</label>
                <input type="number" id="pf" oninput="calculate()" placeholder="599">
            </div>
            <div>
                <label class="text-xs text-gray-400">Margin Money (₹)</label>
                <input type="number" id="margin" oninput="calculate()" placeholder="0">
            </div>
            <div>
                <label class="text-xs text-gray-400">ROI (%)</label>
                <input type="number" id="roi" oninput="calculate()" step="0.1" placeholder="0">
            </div>
        </div>
    </div>

    <div class="result-box">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <p class="text-xs text-gray-400 uppercase">Max Eligible Loan</p>
                <p class="text-lg font-bold text-accent" id="resMaxLoan">₹0</p>
            </div>
            <div>
                <p class="text-xs text-gray-400 uppercase">Actual Loan Amount</p>
                <p class="text-lg font-bold text-white" id="resLoan">₹0</p>
            </div>
            <div>
                <p class="text-xs text-gray-400 uppercase">Monthly EMI</p>
                <p class="text-xl font-bold text-accent" id="resEmi">₹0</p>
            </div>
            <div>
                <p class="text-xs text-gray-400 uppercase">Net Down Payment</p>
                <p class="text-xl font-bold text-accent" id="resDp">₹0</p>
            </div>
        </div>
    </div>

    <script>
        // Load saved data from LocalStorage
        window.onload = () => {
            const inputs = ['invoice', 'approvedLimit', 'maxLtv', 'customerType', 'tenure', 'advEmi', 'dbd', 'pf', 'margin', 'roi'];
            inputs.forEach(id => {
                if(localStorage.getItem('rcd_' + id)) {
                    document.getElementById(id).value = localStorage.getItem('rcd_' + id);
                }
            });
            calculate();
        };

        function getGTL(loanAmount) {
            if (loanAmount <= 0) return 0;
            if (loanAmount < 10000) return 699;
            if (loanAmount < 20000) return 1099;
            if (loanAmount < 30000) return 1199;
            if (loanAmount < 50000) return 1499;
            if (loanAmount < 100000) return 1799;
            return 2398;
        }

        function getRFC(invoice) {
            if (invoice <= 0) return 0;
            if (invoice <= 10000) return 1109;
            if (invoice <= 15000) return 1631;
            if (invoice <= 20000) return 2147;
            if (invoice <= 25000) return 2695;
            if (invoice <= 30000) return 3215;
            if (invoice <= 40000) return 3648;
            if (invoice <= 50000) return 4219;
            if (invoice <= 60000) return 5720;
            if (invoice <= 100000) return 8686;
            return 11438;
        }

        function calculate() {
            // Save state
            const fields = ['invoice', 'approvedLimit', 'maxLtv', 'customerType', 'tenure', 'advEmi', 'dbd', 'pf', 'margin', 'roi'];
            fields.forEach(id => localStorage.setItem('rcd_' + id, document.getElementById(id).value));

            // Fetch inputs
            let invoice = parseFloat(document.getElementById('invoice').value) || 0;
            let approvedLimit = parseFloat(document.getElementById('approvedLimit').value) || 0;
            let maxLtv = parseFloat(document.getElementById('maxLtv').value) || 100;
            let surcharge = parseFloat(document.getElementById('customerType').value) || 0;
            let tenure = parseFloat(document.getElementById('tenure').value) || 1;
            let advEmi = parseFloat(document.getElementById('advEmi').value) || 0;
            let dbd = parseFloat(document.getElementById('dbd').value) || 0;
            let pf = parseFloat(document.getElementById('pf').value) || 0;
            let margin = parseFloat(document.getElementById('margin').value) || 0;
            let roi = parseFloat(document.getElementById('roi').value) || 0;

            if(tenure <= 0) tenure = 1; 

            // Core Logic Validations
            let maxLoanByLTV = invoice * (maxLtv / 100);
            let maxLoanByLimit = (approvedLimit > 0) ? (approvedLimit * tenure) / (tenure - advEmi || 1) : invoice;
            
            let loanAmount = Math.min(invoice, maxLoanByLTV, maxLoanByLimit);
            if (loanAmount < 0) loanAmount = 0;

            // GTL & RFC slabs
            let gtlAmount = getGTL(loanAmount);
            let rfcAmount = getRFC(invoice);
            
            let remainingTenure = tenure - advEmi;
            if(remainingTenure <= 0) remainingTenure = 1;

            // EMI Breakdown
            let baseEmi = loanAmount / tenure;
            let gtlEmi = gtlAmount / remainingTenure;
            let rfcEmi = rfcAmount / remainingTenure;
            let roiEmi = (loanAmount * (roi/100)) / 12;

            let totalMonthlyEmi = Math.ceil(baseEmi + gtlEmi + rfcEmi + roiEmi);

            // DP Breakdown
            let invoiceGap = invoice - loanAmount;
            let advanceEmiAmount = baseEmi * advEmi;
            let dbdAmount = loanAmount * ((dbd/100) + ((dbd/100) * 0.18)); // Incl GST
            
            let netDp = Math.ceil(invoiceGap + advanceEmiAmount + dbdAmount + pf + surcharge + margin);

            // Update UI
            document.getElementById('resMaxLoan').innerText = '₹' + Math.round(maxLoanByLimit).toLocaleString('en-IN');
            document.getElementById('resLoan').innerText = '₹' + Math.round(loanAmount).toLocaleString('en-IN');
            document.getElementById('resEmi').innerText = '₹' + totalMonthlyEmi.toLocaleString('en-IN');
            document.getElementById('resDp').innerText = '₹' + netDp.toLocaleString('en-IN');
        }

        function resetForm() {
            const inputs = ['invoice', 'approvedLimit', 'tenure', 'advEmi', 'dbd', 'pf', 'margin', 'roi'];
            inputs.forEach(id => {
                document.getElementById(id).value = '';
                localStorage.removeItem('rcd_' + id);
            });
            document.getElementById('maxLtv').value = '100';
            calculate();
        }
    </script>
</body>
</html>
